name: Release

# Publish the checked npm artifact after a maintainer tags a reviewed release commit.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Check, build and pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} does not match the package.json version ${version}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:worker
      - run: npm run worker:check
      - run: npm run build
      - run: node dist/index.js --version

      - name: Smoke test over stdio against the fake History API
        run: npm run smoke

      # dist/ is built and bundles @shieldlabs-ai/node: pack it without running the build again.
      - run: npm pack --ignore-scripts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: shieldlabs-ai-mcp-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish unless this version is already on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$(npm view "@shieldlabs-ai/mcp@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]; then
            echo "@shieldlabs-ai/mcp@${VERSION} is already on npm: nothing to publish."
            exit 0
          fi
          npm publish "shieldlabs-ai-mcp-${VERSION}.tgz" --provenance --access public
